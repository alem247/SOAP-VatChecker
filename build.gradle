plugins {
    id 'java'
    id 'war'
}

group = 'com.naloga'
version = '1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}
dependencies {
    providedCompile 'javax:javaee-api:7.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
